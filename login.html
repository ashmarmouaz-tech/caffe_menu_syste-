<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل دخول الكافيه - SaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #0b0806; color: #f5ebe0; }
  </style>
</head>
<body class="min-h-screen p-5 flex justify-center items-center">

  <div class="w-full max-w-md bg-[#180f0a] border border-[#d9a066]/30 rounded-3xl p-6 space-y-6 shadow-2xl">
    <header class="text-center border-b border-[#d9a066]/30 pb-4">
      <h1 class="text-2xl font-extrabold text-[#eab364]">بوابة دخول الكافيهات ☕</h1>
      <p class="text-xs text-[#b89f8d] mt-1">أدخل معرّف كافيهك وكلمة السر للوصول إلى لوحة التحكم</p>
    </header>

    <div class="space-y-4">
      <div>
        <label class="block text-xs text-[#b89f8d] mb-1">معرّف الكافيه</label>
        <input type="text" id="loginCafeId" placeholder="مثال: royal-cafe" dir="ltr" class="w-full bg-[#23150e] border border-[#d9a066]/30 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#eab364]" />
      </div>

      <div>
        <label class="block text-xs text-[#b89f8d] mb-1">كلمة السر</label>
        <input type="password" id="loginPassword" placeholder="كلمة السر الخاصة بك" class="w-full bg-[#23150e] border border-[#d9a066]/30 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#eab364]" />
      </div>

      <button onclick="cafeLogin()" class="w-full bg-[#eab364] hover:bg-[#d99b43] text-[#120b07] font-bold py-3 rounded-xl transition cursor-pointer">
        تسجيل الدخول 🔓
      </button>

      <p id="loginMsg" class="text-center text-sm font-bold"></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAKrzt23VEmwrYInkrRO-VtLNAGILnvAis",
      authDomain: "saas21.firebaseapp.com",
      projectId: "saas21",
      storageBucket: "saas21.firebasestorage.app",
      messagingSenderId: "493115658602",
      appId: "1:493115658602:web:854c0496b336866b669513",
      measurementId: "G-8MRHWFJEMY"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.cafeLogin = async function() {
      const cafeId = document.getElementById('loginCafeId').value.trim().toLowerCase().replace(/\s+/g, '-');
      const password = document.getElementById('loginPassword').value.trim();
      const loginMsg = document.getElementById('loginMsg');

      if (!cafeId || !password) {
        alert('يرجى إدخال المعرّف وكلمة السر!');
        return;
      }

      loginMsg.textContent = 'جاري التحقق...';
      loginMsg.className = 'text-center text-sm font-bold text-[#b89f8d]';

      try {
        const docRef = doc(db, "cafes", cafeId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const cafeData = docSnap.data();
          if (cafeData.password === password) {
            // تخزين المعرّف بـ SessionStorage ليتعرف عليه ملف الـ admin
            sessionStorage.setItem('activeCafeId', cafeId);
            sessionStorage.setItem('activeCafeName', cafeData.name);
            
            // تحويله فوراً للوحة تحكمه الخاصة
            window.location.href = 'admin.html';
          } else {
            loginMsg.textContent = 'كلمة السر غير صحيحة! ❌';
            loginMsg.className = 'text-center text-sm font-bold text-red-400';
          }
        } else {
          loginMsg.textContent = 'معرّف الكافيه غير موجود! ❌';
          loginMsg.className = 'text-center text-sm font-bold text-red-400';
        }
      } catch (error) {
        console.error(error);
        loginMsg.textContent = 'حدث خطأ في الاتصال.';
        loginMsg.

className = 'text-center text-sm font-bold text-red-400';
      }
    };
  </script>
</body>
</html>
